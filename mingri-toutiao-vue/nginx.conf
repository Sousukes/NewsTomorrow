# nginx 站点配置：SPA 静态托管 + /api 反代（C9 / D8）
#
# 两个容易踩的点，都在这里处理了：
#
# 1) **SPA fallback**：`try_files $uri $uri/ /index.html`。少了它，用户刷新
#    `/admin/news` 直接 404 —— 因为那些路由只在浏览器里有对应文件。
#    但**不能**对 /api/ 做同样的 fallback：接口 404 时返回一个 HTML 页面，
#    前端 `response.json()` 会报一个完全误导的解析错误。
#
# 2) **CSP 的 frame-ancestors**：构建期注入 `<meta>` 的策略里带不了它
#    （规范明确忽略 meta 里的 frame-ancestors）。这里**只补这一条**，
#    其余策略仍来自构建期注入的 meta —— 两份策略各写一遍必然漂移，
#    而 CSP 多头是**取交集**生效的，只补 meta 表达不了的那条最稳。

upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 媒体类型与压缩：图片走代理已经是 WebP 了（装了 Pillow 时），
    # 这里主要压的是 JS/CSS
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 安全响应头：frame-ancestors 只在**响应头**里才生效（见文件头注释）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # 带内容哈希的构建产物：可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存：它是"引用了哪些哈希资源"的唯一清单，
    # 缓存住它会让用户一直拿到旧版本引用（表现为发版后用户没变化）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 反代：必须排在 SPA fallback **之前**，且不允许 fallback
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 限流按客户端 IP 计数（C2），必须透传真实 IP。
        # 注意：后端只在 TRUSTED_PROXIES 命中的网段才采信 X-Forwarded-For
        # （防止伪造绕过限流），所以这里的 $proxy_add_x_forwarded_for
        # 要配合部署环境的网段配置一起看，详见 docs/deploy.md
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 图片代理（B4）可能拉较大的图，超时给足
        proxy_buffering on;
        proxy_buffers 8 16k;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}