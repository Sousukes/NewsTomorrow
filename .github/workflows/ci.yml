name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端校验（依赖审计 + 类型 + Lint + 格式 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mingri-toutiao-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mingri-toutiao-vue/package-lock.json
      - run: npm ci
      # C8：依赖漏洞审计。放在类型检查之前——漏洞与代码质量无关，
      # 先失败在便宜的地方。--audit-level=high：只拦高危及以上，
      # 低危噪音交给 dependabot/人工，不让 CI 变成「天天红的狼来了」。
      - name: 依赖漏洞审计（npm audit）
        run: npm audit --audit-level=high
      - name: 类型检查
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: 格式检查
        run: npm run format:check
      - name: 单元测试
        run: npm run test
      - name: 构建
        run: npm run build
      - name: Storybook 静态构建
        run: npm run build-storybook

  backend:
    name: 后端校验（依赖审计 + 迁移 + 启动 + 契约检查）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-api
    env:
      # 全 job 共用同一个库：迁移与启动后端必须是**同一份** schema，
      # 否则「upgrade 过了」与「实际起得来」是两件事，环境债照样藏得住。
      # schema 由 Alembic 单轨管理，启动前必须先 upgrade（见「迁移升级」步骤）。
      DATABASE_URL: sqlite:///./ci.db
    # 漂移检查必须在 PostgreSQL 上跑：SQLite 无法反射外键与 GIN 索引，
    # `alembic check` 会把 FK / pg_trgm 索引误报成「新增迁移操作」（本地已实测）。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toutiao
          POSTGRES_PASSWORD: toutiao
          POSTGRES_DB: toutiao
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server-api/requirements.txt
      - run: pip install -r requirements.txt
      # C8：依赖漏洞审计（pip-audit 审计的是**整个已安装环境**）。
      # 先升级 pip：venv 自带的 pip 同样在审计范围内，旧版 pip 自身
      # 就有通告（PYSEC-2026-3721，26.2 修复）——不升级的话，CI 会红在
      # 一个与项目无关的包上，而这种「狼来了」最伤审计的可信度。
      - name: 依赖漏洞审计（pip-audit）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit
      - name: 导入自检（配置可加载）
        run: python -c "import main; print('backend import OK')"
      # F1：迁移链与漂移检查。P1-24 曾因「新迁移未 upgrade」导致 uvicorn
      # 起不来，而 CI 没有这一道，环境债一直拖到本地才暴露。
      - name: 迁移升级（SQLite，兼作启动前置）
        run: python -m alembic upgrade head
      - name: 迁移漂移检查（alembic check · PostgreSQL）
        env:
          DATABASE_URL: postgresql+psycopg://toutiao:toutiao@localhost:5432/toutiao
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: 单元测试（带覆盖率门槛，F2）
        # 门槛在 .coveragerc 的 fail_under（实测 −2）：低于它这一步直接失败，
        # 于是"加了模块不写测试"过不了 CI。--cov-report=term 只打没覆盖满的
        # 文件，避免日志被 100% 的模块刷屏。
        run: pytest -q --cov --cov-report=term:skip-covered --cov-report=xml:htmlcov/coverage.xml
      # 覆盖率报告作为构件留存：GitHub Actions 里可直接下载对比历史，
      # 不引入 codecov 这类外部服务（那会带来数据外发与第三方可用性依赖）
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server-api/htmlcov/coverage.xml
          if-no-files-found: error
      - name: 启动后端
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          # 起不来必须**显式失败**：此前探活失败也会被当成成功，
          # 于是契约检查跑在一个根本没起来的后端上（P1-24 那类环境债因此藏得住）
          if [ "$ok" != "1" ]; then
            echo "::error::后端未能在 30 秒内就绪，日志如下："
            cat /tmp/api.log
            exit 1
          fi
      - name: 契约检查（前后端）
        working-directory: mingri-toutiao-vue
        env:
          DEMO_PHONE: '13800138000'
          DEMO_PASSWORD: '123456'
        run: |
          # 复用后端配置里的演示密码，避免与仓库内默认值脱节
          pw=$(cd ../server-api && python -c "from app.config import DEMO_PASSWORD;print(DEMO_PASSWORD)")
          DEMO_PASSWORD="$pw" node scripts/contract-check.mjs