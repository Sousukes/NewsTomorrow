name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端校验（类型 + Lint + 格式 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mingri-toutiao-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mingri-toutiao-vue/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: 格式检查
        run: npm run format:check
      - name: 单元测试
        run: npm run test
      - name: 构建
        run: npm run build
      - name: Storybook 静态构建
        run: npm run build-storybook

  backend:
    name: 后端校验（依赖 + 启动 + 契约检查）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server-api/requirements.txt
      - run: pip install -r requirements.txt
      - name: 导入自检（配置可加载）
        run: python -c "import main; print('backend import OK')"
      - name: 单元测试
        run: pytest -q
      - name: 启动后端
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - name: 契约检查（前后端）
        working-directory: mingri-toutiao-vue
        env:
          DEMO_PHONE: '13800138000'
          DEMO_PASSWORD: '123456'
        run: |
          # 复用后端配置里的演示密码，避免与仓库内默认值脱节
          pw=$(cd ../server-api && python -c "from app.config import DEMO_PASSWORD;print(DEMO_PASSWORD)")
          DEMO_PASSWORD="$pw" node scripts/contract-check.mjs